<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page is for practicing HTML form, JavaScript CallBack Functions, and JavaScript localStorage.">
    <meta name="author" content="Timothy Puente - WDD131">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
    <title>Product Review</title>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    
    <main>
        <form method="get" action="review.html" class="wfp">
            <fieldset class="products">
                <legend>Product Name</legend>
                <label>
                    <select id="product" name="product" required>
                        <option value="" disabled selected>Select a Product...</option>
                    </select>
                </label>
            </fieldset>

            <fieldset class="star">
                <legend>Overall Rating</legend>
                <input type="radio" id="onestar" name="star" value="1" required>
                <label for="onestar"></label>
                <input type="radio" id="twostar" name="star" value="2" required>
                <label for="twostar"></label>
                <input type="radio" id="threestar" name="star" value="3" required>
                <label for="threestar"></label>
                <input type="radio" id="fourstar" name="star" value="4" required>
                <label for="fourstar"></label>
                <input type="radio" id="fivestar" name="star" value="5" required>
                <label for="fivestar"></label>
            </fieldset>

            <fieldset class="installation">
                <legend>Date of Installation</legend>
                <label><input type="date" id="install" name="installation-date"></label>
            </fieldset>

            <fieldset class="features">
                <legend>Useful Features</legend>
                <label><input type="checkbox" id="D"  name="durability" value="yes">Durability</label>
                <label><input type="checkbox" id="EOU"  name="ease" value="yes">Ease of Use</label>
                <label><input type="checkbox" id="P"  name="performance" value="yes">Performance</label>
                <label><input type="checkbox" id="D"  name="design" value="yes">Design</label>
            </fieldset>

            <fieldset>
                <legend>Written Review (Optional)</legend>
                <label> <input type="textarea" id="write" name="review"></label>
            </fieldset>

            <fieldset>
                <legend>User Name (Optional)</legend>
                <label><input type="text" id="user" name="user"></label>
            </fieldset>
             <input type="submit" value="Post Review">
        </form>


    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Timothy Puente AZ</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
