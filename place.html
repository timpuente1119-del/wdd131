<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Timothy Puente - WDD131">
    <meta name="description" content="Make a page of a place I wish to visit. Montana has beautiful mountains, and an actual change of seasons.">
    <link rel="stylesheet" href="styles/places.css">
    <link rel="stylesheet" href="styles/places-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
    <script src="scripts/places.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
    <title>Country Page</title>
</head>
<body>
    <header>
        <h1> Montana</h1>
    </header>
    <main>
        <div>
            <picture>
                <source media="(min-width: 700px )" srcset="images/montana-small-hero.webp" width="1500" height="750">
                <!-- <source media="(min-width:500px )" srcset="images/montana-mobile-hero.webp"> -->
                <img src="images/montana-mobile-hero.webp" alt="Mobile picture" width="500" height="250">
            </picture>

            <section class="data">
                <h2>Data</h2>
                <ul>
                    <!-- The wire frame shows label: value. Figure it out -->
                     <!-- AI informed that using label in html may not be the best practice. It advised using 
                      label: value pairs, like this:
                      <div class="data-row">
                        <span class="label-text">Population:</span>
                        <span id="population-value" class="value-text"></span>
                    </div> -->
                    <!-- <li>Area: 380,800 km2</li>
                    <li>Population: 1,144,694</li>
                    <li>Capital: Helena</li>
                    <li>Time Zone: UTC-7:00</li>
                    <li>Highest Elevation:  3,903.5 m</li>
                    <li>Income Rank: 34th</li> -->

                    <span class="data-row">
                        <span class="label-text">Area:</span>
                        <span id="area-value" class="value-text"></span>
                    </span>
                    <span class="data-row">
                        <span class="label-text">Population:</span>
                        <span id="population-value" class="value-text"></span>
                    </span>

                    <span class="data-row">
                        <span class="label-text">Capital:</span>
                        <span id="capital-value" class="value-text"></span>
                    </span>

                    <span class="data-row">
                        <span class="label-text">Time Zone:</span>
                        <span id="time-zone-value" class="value-text"></span>
                    </span>

                    <span class="data-row">
                        <span class="label-text">Highest Elevation:</span>
                        <span id="highest-elevation-value" class="value-text"></span>
                    </span>

                    <span class="data-row">
                        <span class="label-text">Income Rank:</span>
                        <span id="income-rank-value" class="value-text"></span>
                    </span>
                </ul>
            </section>

            <section class="weather">
                <div class="header-weather">
                <h2>Weather</h2>
                <span class="large-weather"> </span>
                </div>
                <picture class="mobile-weather">
                    <img src="images/partly-cloudy-mobile.svg" alt="Mobile weather emoji">
                </picture>
                
                <ul>
                    <!-- <li>Temperature: </li>
                    <li>Conditions: </li>
                    <li>Wind: </li>
                    <li>Wind Chill:</li> -->
                    <span class="data-row">
                        <span class="label-text">Temperature:</span>
                        <span id="temperature-value" class="value-text"></span>
                    </span>

                    <span class="data-row">
                        <span class="label-text">Conditions:</span>
                        <span id="conditions-value" class="value-text"></span>
                    </span>

                    <span class="data-row">
                        <span class="label-text">Wind:</span>
                        <span id="wind-value" class="value-text"></span>
                    </span>

                    <span class="data-row">
                        <span class="label-text">Wind Chill:</span>
                        <span id="wind-chill-value" class="value-text"></span>
                    </span>

                </ul>
            </section>
        </div>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Timothy Puente AZ</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
